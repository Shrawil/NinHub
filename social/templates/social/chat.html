{% extends "base.html" %}

{% block content %}
<style>
:root{
    --chat-bg:#0d1117;

    --border:#30363d;

    --sent-bg:#1f6feb;
    --sent-text:#fff;

    --received-bg:#c9d1d9;
    --received-text:#0d1117;

    --input-bg:#161b22;
    --input-text:#fff;
}

.chat-page{
    position:fixed;
    top:0;
    left:260px;      /* sidebar width */
    right:0;
    bottom:0;

    display:flex;
    flex-direction:column;

    background:var(--chat-bg);

    padding:20px;

    z-index:100;

    overflow:hidden;
}

.chat-header{
    display:flex;
    align-items:center;

    padding:16px 20px;

    background:var(--chat-bg);

    border-radius:16px;

    margin-bottom:12px;
}

.chat-header h2{
    margin-left:12px;
    font-size:22px;
    font-weight:600;
}

.chat-tools{
    margin-left:auto;
    display:flex;
    gap:10px;
}

.chat-tools button{
    width:38px;
    height:38px;
    border:none;
    border-radius:10px;
    background:#1b2330;
    color:white;
    cursor:pointer;
    font-size:18px;
    transition:.2s;
}

.chat-tools button:hover{
    background:#2b3648;
}

.messages{
    flex:1;
    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;

    display:flex;
    flex-direction:column;
    gap:10px;

    padding:20px;
}

.messages::-webkit-scrollbar{
    width:6px;
}

.messages::-webkit-scrollbar-thumb{
    background:#30363d;
    border-radius:10px;
}

.bubble-row{
    display:flex;
    max-width:65%;
}

.sent{
    align-self:flex-end;
}

.received{
    align-self:flex-start;
}

.bubble{
    padding:10px 16px;
    border-radius:10px;
    font-size:14px;
    border:1px solid var(--border);
    transition:.3s;
}

.sender-name{
    display:block;
    font-size:11px;
    font-weight:bold;
    margin-bottom:3px;
    opacity:.6;
}

.sent .bubble{
    background:var(--sent-bg);
    color:var(--sent-text);
    border-color:var(--sent-bg);
}

.received .bubble{
    background:var(--received-bg);
    color:var(--received-text);
}

.chat-form{
    display:flex;
    gap:10px;

    margin-top:12px;

    padding:16px;

    background:var(--chat-bg);

    border-radius:16px;
}

.chat-form input{
    flex:1;
    padding:12px 16px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--input-bg);
    color:var(--input-text);
    outline:none;
}

.chat-form button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:var(--sent-bg);
    color:white;
    cursor:pointer;
}

.chat-fullscreen{
    position:fixed;
    inset:0;
    z-index:9999;
    padding:25px;
}

@media(max-width:768px){

.chat-page{
    position:fixed;
    inset:0 0 65px 0;
    padding:15px;
}

body.chat-mode .chat-page{
    inset:0 !important;
}

.bubble-row{
    max-width:85%;
}

}
</style>

<div class="chat-page">
    <div class="chat-header">

        <a href="{% url 'chat_list' %}">
            <i class="ri-arrow-left-line"></i>
        </a>

        <h2>{{ other_user.username }}</h2>

        <div class="chat-tools">

            <button id="themeBtn">
                <i class="ri-palette-line"></i>
            </button>

        </div>

    </div>
    <div class="messages" id="messages" data-last-id="{{ messages.last.id|default:0 }}">
        {% for message in messages %}
            <div class="bubble-row {% if message.sender == request.user %}sent{% else %}received{% endif %}" data-id="{{ message.id }}">
                <div class="bubble">
                    {% if message.sender != request.user %}
                    <span class="sender-name">{{ message.sender }}</span>
                    {% endif %}
                    {{ message.text }}
                </div>
            </div>
        {% empty %}
            <p class="no-messages">No messages yet.</p>
        {% endfor %}
    </div>

  <form method="POST" class="chat-form">
    {% csrf_token %}
    <input
      type="text"
      name="message"
      autocomplete="off"
      placeholder="Type a message..."
      required
    >
    <button type="submit">Send</button>
  </form>
</div>
<script>
  const messagesBox = document.getElementById('messages');
  const otherUsername = "{{ other_user.username }}";
  const currentUsername = "{{ request.user.username }}";
  let lastId = parseInt(messagesBox.dataset.lastId || '0');

  function appendMessage(sender, text, isMe, id) {
    if (document.querySelector(`.bubble-row[data-id="${id}"]`)) {
        return;
    }

    const row = document.createElement("div");
    row.className = "bubble-row " + (isMe ? "sent" : "received");
    row.dataset.id = id;

    row.innerHTML = `
        <div class="bubble">
            <span class="sender-name">${sender}</span>
            ${text}
        </div>
    `;

    messagesBox.appendChild(row);
    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  async function pollMessages() {
    try {
      const res = await fetch(`/social/chat/${otherUsername}/poll/?after_id=${lastId}`);
      const data = await res.json();
      data.messages.forEach(msg => {
        appendMessage(msg.sender, msg.text, msg.is_me, msg.id);
        lastId = msg.id;
      });
    } catch (err) {
      console.error('Polling failed:', err);
    }
  }

  setInterval(pollMessages, 2000);

  const form = document.querySelector('.chat-form');
  form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const input = form.querySelector('input[name="message"]');
      const text = input.value.trim();
      if (!text) return;

      const formData = new FormData(form);   // snapshot FIRST, while input still has the text
      input.value = '';                      // clear AFTER snapshot is taken

      await fetch(window.location.pathname, {
        method: 'POST',
        body: formData,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });

      pollMessages();
  });

  messagesBox.scrollTop = messagesBox.scrollHeight;

  /* ---------------- THEMES ---------------- */

  const themes=[

  {
  bg:"#0d1117",
  sent:"#1f6feb",
  received:"#c9d1d9",
  receivedText:"#0d1117",
  input:"#161b22"
  },

  {
  bg:"#313338",
  sent:"#5865F2",
  received:"#404249",
  receivedText:"#ffffff",
  input:"#383a40"
  },

  {
  bg:"#111b21",
  sent:"#005c4b",
  received:"#202c33",
  receivedText:"#fff",
  input:"#202c33"
  },

  {
  bg:"#000000",
  sent:"#00aa00",
  received:"#111111",
  receivedText:"#00ff00",
  input:"#111111"
  },

  {
  bg:"#24153d",
  sent:"#7c3aed",
  received:"#3d2a5d",
  receivedText:"#fff",
  input:"#2d1f4d"
  }

  ];

  let currentTheme=Number(localStorage.getItem("chatTheme"))||0;

  function applyTheme(i){

  const t=themes[i];

  document.documentElement.style.setProperty("--chat-bg",t.bg);
  document.documentElement.style.setProperty("--sent-bg",t.sent);
  document.documentElement.style.setProperty("--received-bg",t.received);
  document.documentElement.style.setProperty("--received-text",t.receivedText);
  document.documentElement.style.setProperty("--input-bg",t.input);

  localStorage.setItem("chatTheme",i);

  }

  applyTheme(currentTheme);

  document.getElementById("themeBtn").onclick=function(){

  currentTheme++;

  if(currentTheme>=themes.length)
      currentTheme=0;

  applyTheme(currentTheme);

  };
  window.onload = () => {
      document.body.classList.add("chat-mode");
  };
</script>
{% endblock %}
