{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | NinHub</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <style>
        @media (max-width:768px){

            .background{
                padding:20px;
                align-items:center;
                justify-content:center;
            }

            .login-card{
                width:100%;
                max-width:400px;
                padding:30px 22px;
                border-radius:18px;
            }

            .logo{
                width:90px;
                height:90px;
                margin-bottom:15px;
            }

            .login-card h1{
                font-size:28px;
            }

            .login-card p{
                font-size:14px;
                margin-bottom:20px;
            }

            .form-group{
                margin-bottom:16px;
            }

            .form-group label,
            label{
                font-size:14px;
            }

            .form-group input,
            input{
                width:100%;
                font-size:16px;
                padding:14px;
            }

            button{
                width:100%;
                padding:14px;
                font-size:16px;
                margin-top:10px;
            }

            .bottom-text{
                margin-top:22px;
                text-align:center;
                font-size:14px;
            }

            .form-errors{
                font-size:14px;
            }

        }
    </style>
</head>

<body>

<div class="background">

    <div class="login-card">

        <img src="{% static 'logo/NinHubLogo.png' %}" class="logo">

        <h1>Welcome Back</h1>

        <p>Sign in to continue to NinHub</p>
        {% if error %}
            <p style="color: red;">{{error}}</p>
        {% endif %}
        <form method="POST">

            {% csrf_token %}

            <label>Username</label>
            <input
            type="text"
            name="username"
            class="auth-input"
            required
            >
            
            <label>Password</label>
            
            <input
                type="password"
                name="password"
                class="auth-input"
                required
            >
            <button type="submit">
                Login
            </button>

        </form>

        <div class="bottom-text">

            Don't have an account?

            <a href="{% url 'register' %}">
                Register
            </a>

        </div>

    </div>

</div>

</body>
</html>
