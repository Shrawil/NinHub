{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}NinHub{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'css/base.css' %}">
        {% block css %}{% endblock %}
        <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
    </head>
    <body>
        <div class="layout">
            <aside class="sidebar">
                <h1 class="logo">NinHub</h1>
                <nav>
                    <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                        <i class="ri-home-5-line"></i>
                        <span>Home</span>
                    </a>
                    <a href="{% url 'search' %}" class="{% if request.resolver_match.url_name == 'search' %}active{% endif %}">
                        <i class="ri-search-line"></i>
                        <span>Search</span>
                    </a>
                    <!-- 
                        <a href="#">
                            <i class="ri-compass-line"></i>
                            Explore
                            <span>Explore</span>
                        </a>
                    -->
                        <a href="{% url 'chat_list' %}" class="{% if request.resolver_match.url_name == 'chat_list' %}active{% endif %}">
                        <i class="ri-message-2-line"></i>
                        <span>Messages</span>
                    </a>
                    <!--
                        <a href="#">
                            <i class="ri-heart-3-line"></i>
                            Notifications
                            <span>Notifications</span>
                        </a>
                    -->
                    <a href="{% url 'create-post' %}" class="{% if request.resolver_match.url_name == 'create_post' %}active{% endif %}">
                        <i class="ri-add-box-line"></i>
                        <span>Create</span>
                    </a>
                    <a href="{% url 'me' %}" class="{% if request.resolver_match.url_name == 'me' %}active{% endif %}">
                        <i class="ri-user-line"></i>
                        <span>Profile</span>
                    </a>
                </nav>
                <div class="logout-container">
                    <a href="{% url 'logout' %}" class="logout-btn">
                        <i class="ri-logout-box-r-line"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </aside>
            <main class="content">
                {% block content %}
                {% endblock %}
            </main>
        </div>
        {% block js %}{% endblock %}
    </body>
</html>
